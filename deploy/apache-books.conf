# Книги TTS-бота: статика для раздачи по ссылкам через прокси-фасад.
#
# Установка на боевом сервере:
#   cp deploy/apache-books.conf /etc/apache2/sites-available/books.conf
#   mkdir -p /var/www/books
#   a2ensite books && apache2ctl configtest && systemctl reload apache2
#
# Слушает отдельный порт без TLS: снаружи его закрывает Caddy на прокси
# (155.212.162.33), он же терминирует HTTPS для book.2aim.ru. Прямые заходы
# на порт разрешены только самому прокси и локальным проверкам.

Listen 8080

<VirtualHost *:8080>
    ServerName book.2aim.ru
    DocumentRoot /var/www/books

    <Directory /var/www/books>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Только прокси-фасад: остальные получают 403.
    # Важно: в этом vhost НЕ доверяем X-Forwarded-For (в других хостах на
    # сервере mod_remoteip включён ради Cloudflare). Иначе Apache подменяет
    # REMOTE_ADDR реальным адресом клиента, и проверка «пускать только прокси»
    # ломается: внешний клиент проходил бы как он сам.
    <IfModule mod_remoteip.c>
        RemoteIPTrustedProxy 127.0.0.1
    </IfModule>

    <Location />
        Require ip 155.212.162.33 127.0.0.1
    </Location>

    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set X-Content-Type-Options "nosniff"

    # Ссылки живут неделю, кэш на сутки ускоряет докачку больших mp3.
    <FilesMatch "\.(mp3|m4a|ogg|zip)$">
        Header set Cache-Control "private, max-age=86400"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/books_error.log
    CustomLog ${APACHE_LOG_DIR}/books_access.log combined
</VirtualHost>
