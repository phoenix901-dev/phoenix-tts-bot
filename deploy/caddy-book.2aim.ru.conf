# Блок для Caddyfile на прокси-сервере (155.212.162.33).
#
# Добавить в конец /etc/caddy/Caddyfile, затем:
#   caddy validate --config /etc/caddy/Caddyfile
#   systemctl reload caddy
#
# DNS: A-запись book.2aim.ru -> 155.212.162.33. Сертификат Caddy получит сам
# (Let's Encrypt, HTTP-01) сразу после появления записи.
#
# Файлы физически лежат на боевом сервере (144.76.83.24:8080, Apache) —
# здесь только фасад и TLS. Внешний клиент видит адрес прокси, а не сервера.

book.2aim.ru {
	reverse_proxy http://144.76.83.24:8080 {
		transport http {
			dial_timeout 5s
			# Ответ на большую книгу приходит не сразу: ждём заголовки дольше.
			response_header_timeout 60s
		}
		header_up Host book.2aim.ru
	}
	header X-Robots-Tag "noindex, nofollow"
}
